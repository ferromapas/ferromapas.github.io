version: 1.1.0
date: 2026-11-06
notes: |
  - **Metrotranvía de Mendoza:** pasa a tener su propia sección, con las líneas
    Gutiérrez - Mendoza - Aeropuerto y Pellegrini - Benegas - Luján de Cuyo y todos
    sus paradores. Reemplaza al antiguo Metrotranvía Urbano Mendoza.
  - **Ferrocarril San Martín:** se completa el Div 41 (Fray Luis Beltrán - Tropero Sosa)
    con sus paradas y los desvíos a las bodegas Santa Ana y Tomba. También se ajusta
    la ubicación de la estación Gustavo André.
  - **Ferrocarril Belgrano:** en el ramal A12 (Guaymallén - Las Cuevas) se dibuja la
    traza que quedó bajo el dique Potrerillos, y se corrigen algunas ubicaciones.
    También se reordena el ramal A13.
  - **Reubicación de vías del Ferrocarril Trasandino (proyecto):** proyecto de
    reubicación del Ferrocarril Trasandino en Potrerillos por la construcción del dique
    Potrerillos, que nunca se llevó a cabo. Se incluye la traza proyectada con sus
    puentes, túneles, estaciones y kilometrajes.
  - **Otros:** nuevo ramal La Plata - 19 de Noviembre (Sarmiento) y Divisadero Pinamar (Roca).
  - **Ferrocarril Trasandino Central Chileno:** se agregan los túneles, puentes y
    estaciones del tramo entre Los Andes y Río Blanco, y se ajusta la traza.
